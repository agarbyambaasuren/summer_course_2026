<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toolbox {
            display: flex;
            margin-bottom: 10px;
        }
    </style>
</head>

<body style="background-color: rgb(124, 124, 124);">
    <div class="toolbox" style="width: 100%; height: 100px; border: solid 10px cornflowerblue; background-color: rgb(243, 243, 234);">
        <div style="height: 50px; width: 50px;">
            <button style="height: 50px; width: 100px; border-radius: 0;" class="circleBrush">Pen/Circle brush</button>
        </div>
        <div style="height: 50px; width: 50px; margin-top: 60px; margin-left: -50px;">
            <label style="height: 50px; width: 50px; border-radius: 0;">Width
                <input type="number" class="circleQuantity" name="quantity" min="1" max="100" step="1" value="1">
            </label>
        </div>
        <div style="height: 50px; width: 50px;">
            <button style="height: 50px; width: 100px; border-radius: 0; margin-left: 100px;"class="squareBrush">Square brush</button>
        </div>
        <div style="height: 50px; width: 50px; margin-top: 60px; margin-left: 50px;">
            <label style="height: 50px; width: 50px; border-radius: 0;">Width
                <input type="number" class="squareQuantity" name="quantity" min="1" max="100" step="1" value="1">
            </label>
        </div>
      <div style="margin-left: -150px;margin-top: 75px;"class="circleBrushColor">  <input type="color" id="circBrushColor"></div>
      <div style="margin-left: 100px;margin-top: 75px;"class="squareBrushColor">  <input type="color" id="squareBrushColor"></div>
       <button style="height: 50px; width: 100px; border-radius: 0;margin-left: 50px;" class="eraser">Eraser</button>
       <button style="height: 50px; width: 100px;border-radius: 0;margin-left: 50px;">Clear</button>
       <div style="margin-top: 75px;"> <input type="color" class="background"></div>
    </div>
    <script src="./js/p5.min.js"></script>
    <script src="./js/draw.js"></script>
</body>
</body>

</html>
